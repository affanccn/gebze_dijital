name: Sync Gebze On-Duty Pharmacies

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts/pharmacy-sync
        run: npm install

      - name: Sync pharmacies to Firestore
        working-directory: scripts/pharmacy-sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PHARMACY_API_KEY: ${{ secrets.PHARMACY_API_KEY }}
        run: node sync-pharmacy.js
