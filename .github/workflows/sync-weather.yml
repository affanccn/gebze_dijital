name: Sync Gebze Weather

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/weather-sync/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts/weather-sync
        run: npm install

      - name: Sync weather to Firestore
        working-directory: scripts/weather-sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: node sync-weather.js
