name: Sync Gebze Municipality Events

on:
  schedule:
    - cron: "30 3,11,17 * * *"
  workflow_dispatch:

concurrency:
  group: gebze-events-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-events:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: scripts/events-sync
        run: npm install

      - name: Sync events to Firestore
        working-directory: scripts/events-sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node sync-events.js
