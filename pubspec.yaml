name: gebze_dijital
description: "Gebze Belediyesi Dijital Vatandaş Platformu"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  cached_network_image: ^4.0.4
  url_launcher: ^6.3.3
  flutter_riverpod: ^3.4.3
  google_fonts: ^9.0.0
  image_picker: ^1.2.4
  geolocator: ^14.1.1
  geocoding: ^5.0.0
  firebase_storage: ^13.6.0
  shared_preferences: ^2.5.6
  firebase_auth: ^6.7.0
  confetti: ^0.8.0
  image: ^4.5.4
  http: ^1.6.0
  html: ^0.15.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - gorsel/
    - gorsel/pati/
    - gorsel/tarihi_yerler/
    - gorsel/piknik/
    - gorsel/tesisler/
    - gorsel/yemek/
    - assets/images/
    - assets/images/avatars/
    - assets/mock/