
workflows:
  gebze-dijital-ios:
    name: Gebze Dijital iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    integrations:
      app_store_connect: codemagic

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build iOS IPA
        script: flutter build ipa --release --no-codesign

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
          source: true
